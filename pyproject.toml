[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "char-writevit"
version = "0.1.0"
description = "Character-first WriteViT handwriting generation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "Pillow>=10",
  "numpy>=1.24",
  "PyYAML>=6",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
charwritevit-prepare-iam = "charwritevit.cli.prepare_iam:main"
charwritevit-prepare-char-data = "charwritevit.cli.prepare_char_data:main"
charwritevit-train-classifier = "charwritevit.cli.train_classifier:main"
charwritevit-train-synthetic = "charwritevit.cli.train_synthetic:main"
charwritevit-train-ocr = "charwritevit.cli.train_ocr:main"
charwritevit-train-iam = "charwritevit.cli.train_iam:main"
charwritevit-sample = "charwritevit.cli.sample:main"
charwritevit-evaluate = "charwritevit.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

