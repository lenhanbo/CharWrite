seed: 42
data:
  iam_root: /kaggle/input/iam-dataset/iam_dataset
  iam_forms_by_writer_root: /kaggle/input/iam-handwritten-forms-dataset
  iam_folder_as_writer: true
  iam_validate_images: false
  prepared_dir: /kaggle/working/charwritevit-data/iam
  char_prepared_dir: /kaggle/working/charwritevit-data/characters
  emnist_root: /kaggle/input/emnist
  emnist_cache: /kaggle/working/charwritevit-data/emnist-index
  auto_download_emnist: true
  fonts_dir: /kaggle/input/handwriting-fonts
  require_font_license: true
  classifier_fonts_optional: true
  image_height: 32
  char_width: 16
  max_word_length: 24
  # WriteViT is one-shot: one reference drives each independent style path.
  style_references: 1
  split: [0.8, 0.1, 0.1]
model:
  architecture: character_refined_writevit
  alphabet: 'Only thewigsofrcvdampbkuq.A-210xT5''MDL,RYHJ"ISPWENj&BC93VGFKz();#:!7U64Q8?+*ZX/%'
  unifont_path: assets/unifont.pickle
  style_dim: 256
  hidden_dim: 256
  # The only CharWriteViT addition before the untouched WriteViT generator.
  character_style_layers: 3
  character_style_heads: 4
  multiscale_depth: 3
  feature_noise: true
  feature_noise_std: 1.0
  dropout: 0.0
train:
  batch_size: 16
  accumulation_steps: 1
  epochs: 200
  classifier_epochs: 30
  classifier_batch_size: 256
  classifier_accumulation_steps: 1
  classifier_learning_rate: 0.001
  classifier_min_learning_rate: 0.00001
  classifier_warmup_epochs: 1.0
  classifier_synthetic_fraction: 0.25
  classifier_synthetic_val_samples: 10000
  learning_rate: 0.00005
  generator_learning_rate: 0.00005
  discriminator_learning_rate: 0.00005
  writer_learning_rate: 0.00005
  ocr_learning_rate: 0.00005
  character_classifier_learning_rate: 0.00005
  generator_every: 2
  num_workers: 0
  log_every: 50
  amp: true
  checkpoint_every: 1
  preview_every: 1
  preview_samples: 10
loss:
  character_style: 1.0

